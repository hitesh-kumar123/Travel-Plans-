<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ── Lightweight SVG favicon (replaces the 395 KB favicon.ico) ── -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a4a6b'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='20' fill='%23e8735a'%3E✈%3C/text%3E%3C/svg%3E" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a4a6b" />

    <!-- ── Preconnect: eliminates DNS + TLS round-trips for fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Primary meta description -->
    <meta
      name="description"
      content="PackGo – Your smart travel planning companion. Plan trips, track expenses, manage packing lists, and explore destinations across India."
    />

    <!-- Open Graph / WhatsApp / LinkedIn / Facebook previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PackGo - Travel Planner" />
    <meta
      property="og:description"
      content="PackGo – Your smart travel planning companion. Plan trips, track expenses, manage packing lists, and explore destinations across India."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PackGo - Travel Planner" />
    <meta
      name="twitter:description"
      content="PackGo – Your smart travel planning companion. Plan trips, track expenses, manage packing lists, and explore destinations across India."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>PackGo - Travel Planner</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
